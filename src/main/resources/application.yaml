server:
  port: 8080

spring:
  application:
    name: carrental

  datasource:
    url: jdbc:postgresql://localhost:5434/carrental_db
    username: carrental
    password: carrental
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      '[hibernate.format_sql]': true
  web:
    error:
      include-binding-errors: always
      include-message: always
      include-stacktrace: never

logging:
  file:
    name: log/carrental.log
  pattern:
    file: "%d %-5level [%thread] %logger:%msg%n"
  level:
    '[org.springframework]': WARN
    '[org.hibernate]': INFO
    '[com.carrental]': DEBUG

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    env:
      enabled: true

  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

info:
  application:
    name: 'Carrental Backend App'
    description: 'This is Carrental Backend Project'
    version: '@project.version@'
